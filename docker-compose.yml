services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-phonebook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phonebook}
      POSTGRES_DB: ${POSTGRES_DB:-phonebook}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ stores data in version-specific subdirs — the old /data path makes it refuse to start
      - pgdata:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-phonebook} -d ${POSTGRES_DB:-phonebook}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Behind a profile so `docker compose up -d` stays Postgres-only and won't fight `pnpm dev`
  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-phonebook}:${POSTGRES_PASSWORD:-phonebook}@postgres:5432/${POSTGRES_DB:-phonebook}
      PORT: 5000
      # A Secure cookie is dropped over plain HTTP, so a host without TLS sets this false.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    ports:
      - "${API_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:5000
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
